<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pole Position</title>


    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


<!-- ======================================
     HERO SECTION
====================================== -->


<header class="hero">


    <video
        id="heroVideo"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="videos/poleposition.mp4"
            type="video/mp4"
        >

    </video>



    <div class="hero-overlay">


        <h1>
            Pole Position
        </h1>


        <h3>
            Celebrating 60 Years in Pole Position
        </h3>


        <h4>
            ★ MAKE SIXTY GREAT AGAIN ★
        </h4>


        <div class="scroll-hint">

            ↓ Explore The Cocktails ↓

        </div>


    </div>


</header>





<!-- ======================================
     DRINK MENU
====================================== -->


<main class="container">


    <h2 class="section-title">

        Republican Party Favorites

    </h2>



    <div
        id="drinkContainer"
        class="drink-grid"
    >


    </div>



</main>







<!-- ======================================
     RECIPE VIEWER
====================================== -->


<section
    id="recipeViewer"
    class="recipe-viewer"
>


    <button
        id="closeViewer"
        class="close-viewer"
        aria-label="Close"
    >

        ✕

    </button>



    <button
        id="previousDrink"
        class="recipe-nav previous"
        aria-label="Previous drink"
    >

        ←

    </button>



    <button
        id="nextDrink"
        class="recipe-nav next"
        aria-label="Next drink"
    >

        →

    </button>



    <div
        id="recipeContent"
        class="recipe-content"
    >


    </div>



</section>





<script src="js/drinks.js"></script>

<script src="js/app.js"></script>



</body>

</html>
