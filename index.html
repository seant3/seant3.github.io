<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pole Position | 60th Birthday Cocktail Menu</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom Styles -->
    <link
        rel="stylesheet"
        href="styles.css">

</head>


<body>


<!-- =========================
     HERO SECTION
========================= -->

<section class="hero">


    <video
        id="heroVideo"
        autoplay
        muted
        loop
        playsinline>

        <source
            src="videos/poleposition.mp4"
            type="video/mp4">

    </video>



    <div class="hero-overlay">


        <h1>
            Pole Position
        </h1>


        <h3>
            Celebrating 60 Years in Pole Position
        </h3>


        <h4>
            ★ MAKE SIXTY GREAT AGAIN ★
        </h4>


    </div>


</section>





<!-- =========================
     COCKTAIL MENU
========================= -->

<main class="container mt-5">


    <h2 class="section-title">

        Republican Party Favorites

    </h2>



    <!-- JavaScript injects cards here -->

    <div
        id="drinkContainer"
        class="row g-4">

    </div>


</main>





<!-- =========================
     COCKTAIL MODAL
========================= -->

<div
    class="modal fade"
    id="drinkModal"
    tabindex="-1"
    aria-hidden="true">


    <div
        class="modal-dialog modal-dialog-centered modal-lg">


        <div
            class="modal-content cocktail-modal">


            <div id="modalContent"></div>


        </div>


    </div>


</div>





<!-- =========================
     JAVASCRIPT
========================= -->


<script src="js/drinks.js"></script>

<script src="js/app.js"></script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
